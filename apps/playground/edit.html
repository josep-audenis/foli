<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foli: editing Word documents</title>
    <style>
      body { margin: 0; background: #e8e8e8; font-family: system-ui, sans-serif; }
      header { display: flex; gap: 16px; align-items: center; padding: 8px 16px; }
      #editor { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 16px; outline: none; }
      #editor > .foli-page { background: #fff; color: #000; box-shadow: 0 1px 4px rgb(0 0 0 / 0.25); }
      .foli-selected-node { outline: 2px solid #1a73e8; }
    </style>
  </head>
  <body>
    <header>
      <label>Open a .docx <input id="file" type="file" accept=".docx" /></label>
      <button id="save" type="button">Save .docx</button>
    </header>
    <main id="editor" aria-label="Document"></main>
    <script type="module" src="/src/edit.ts"></script>
  </body>
</html>
