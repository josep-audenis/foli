<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foli: custom nodes and marks</title>
    <style>
      body { margin: 0; background: #e8e8e8; font-family: system-ui, sans-serif; }
      #editor { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 16px; outline: none; }
      #editor > .foli-page { background: #fff; color: #000; box-shadow: 0 1px 4px rgb(0 0 0 / 0.25); }
      .acme-chip { background: #dbeafe; color: #1e3a8a; border-radius: 0.6em; padding: 0 0.3em; }
      [data-foli-custom="acme:mention"]:not(:has(.acme-chip)) { background: #eee; }
      .acme-card { border: 1px solid #94a3b8; border-radius: 4px; }
      .acme-card-row { padding: 4px 8px; border-top: 1px solid #e2e8f0; }
      .acme-topic { text-decoration: underline dotted #0369a1; }
      .acme-todo { background: #fde68a; }
      .acme-current { box-shadow: -6px 0 0 -3px #60a5fa; }
      h1 { font-size: 1.1rem; margin: 12px 16px 0; }
      #acme-status { margin: 8px 16px 0; color: #333; }
    </style>
  </head>
  <body>
    <main>
      <h1>Custom nodes and marks</h1>
      <div id="editor"></div>
    </main>
    <script type="module" src="/src/extension.ts"></script>
  </body>
</html>
