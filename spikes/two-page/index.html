<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Foli spike: two pages, one editable surface</title>
    <style>
      body {
        margin: 0;
        background: #e9e9e6;
      }
      #editor {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        padding: 24px 0;
        outline: none;
      }
      .page {
        box-sizing: border-box;
        width: 210mm;
        height: 297mm;
        padding: 25.4mm;
        background: #fff;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.15);
      }
      .page-body {
        height: 100%;
      }
      .frag {
        margin: 0 0 12px;
        font: 16px/24px Georgia, "Times New Roman", serif;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        color: #1d1d1b;
      }
      .frag.cont {
        margin-bottom: 0;
      }
      .measure {
        position: absolute;
        top: 0;
        left: -10000px;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
