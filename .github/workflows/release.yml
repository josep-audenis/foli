# Publishes @folijs/* to npm with provenance, after the browser tests and the examples pass on
# Windows (the pre-push hook runs the other checks). Started by hand from the Actions tab, on
# main, after a "Version packages" commit (see docs/contributing.md, "Releasing"). Publishes only
# versions that are not on npm yet, then pushes their git tags. Run on another branch, it runs
# the browser job only: a way to try it before a release.
name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The browser tests (three engines) and the examples, which the pre-push hook does not run. On
  # Windows: the visual snapshots are Windows' (`*-win32.png`). No secret, no write permission.
  browsers:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before the long tests: a release that is not versioned stops here.
      - name: Refuse unapplied changesets
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          pending=$(find .changeset -name '*.md' ! -name README.md)
          if [ -n "$pending" ]; then
            echo "::error::Changesets not applied yet: run 'pnpm changeset version' and commit first."
            echo "$pending"
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      # The PDF tests import the built packages (`dist/`), and the PDF renderer is built.
      - run: pnpm build
      - run: pnpm exec playwright install chromium firefox webkit
      - run: pnpm test:e2e
      - run: pnpm examples

  publish:
    needs: browsers
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Holds the NPM_TOKEN secret; add required reviewers to it to approve each publish.
    environment: npm
    permissions:
      contents: write # push the release tags
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in a publishing job (a poisoned cache would ship).
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Refuse unapplied changesets and unversioned packages
        run: |
          pending=$(find .changeset -name '*.md' ! -name README.md)
          if [ -n "$pending" ]; then
            echo "::error::Changesets not applied yet: run 'pnpm changeset version' and commit first."
            echo "$pending"
            exit 1
          fi
          # A private package (one in development, not published yet) may stay at 0.0.0.
          if grep -L '"private": true' packages/*/package.json | xargs grep -l '"version": "0.0.0"'; then
            echo "::error::Version 0.0.0 is the unreleased placeholder: version the packages first."
            exit 1
          fi

      - run: pnpm check

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Also after a failed publish: tags the versions that are on npm (Changesets tags only what
      # it published in this run, so a re-run would never tag a version published by a failed one).
      - name: Tag and push released versions
        if: ${{ !cancelled() }}
        run: |
          for manifest in packages/*/package.json; do
            name=$(node -p "require('./$manifest').name")
            version=$(node -p "require('./$manifest').version")
            tag="$name@$version"
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null && continue
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null && continue
            curl -fsS -o /dev/null "https://registry.npmjs.org/${name/\//%2f}/$version" || continue
            git tag -a "$tag" -m "$tag"
          done
          git tag
          # --no-verify: `pnpm install` installed the repo's pre-push hook (it runs pnpm check).
          git push --no-verify "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --tags
        env:
          GH_TOKEN: ${{ github.token }}

      # A GitHub Release per pushed tag with no release yet, its notes the version's CHANGELOG
      # section. Core (the fixed group's lead) is marked Latest. Re-runs skip existing releases.
      - name: Create GitHub Releases
        if: ${{ !cancelled() }}
        run: |
          for manifest in packages/*/package.json; do
            dir=$(dirname "$manifest")
            name=$(node -p "require('./$manifest').name")
            version=$(node -p "require('./$manifest').version")
            tag="$name@$version"
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || continue
            gh release view "$tag" >/dev/null 2>&1 && continue
            notes=$(awk -v v="## $version" '$0==v{f=1;next} f&&/^## /{exit} f' "$dir/CHANGELOG.md")
            printf '%s\n\n---\n`npm install %s@%s` · [npm](https://www.npmjs.com/package/%s/v/%s)\n' \
              "$notes" "$name" "$version" "$name" "$version" > "$RUNNER_TEMP/notes.md"
            latest=false; [ "$name" = "@folijs/core" ] && latest=true
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --latest=$latest
          done
        env:
          GH_TOKEN: ${{ github.token }}
