# Publishes @folijs/* to npm with provenance. Release-only: no CI runs here (checks run in the
# local pre-push hook). Started by hand from the Actions tab, on main, after a "Version
# packages" commit (see docs/contributing.md, "Releasing"). Publishes only versions that are not
# on npm yet, then pushes their git tags.
name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Holds the NPM_TOKEN secret; add required reviewers to it to approve each publish.
    environment: npm
    permissions:
      contents: write # push the release tags
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in a publishing job (a poisoned cache would ship).
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Refuse unreleased changesets
        run: |
          pending=$(find .changeset -name '*.md' ! -name README.md)
          if [ -n "$pending" ]; then
            echo "::error::Changesets not applied yet: run 'pnpm changeset version' and commit first."
            echo "$pending"
            exit 1
          fi

      - run: pnpm check

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Push release tags
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --tags
        env:
          GH_TOKEN: ${{ github.token }}
