# Deploys the site (apps/site: landing, docs, /test/) to Cloudflare Pages. Runs on pushes to
# main only, so pull requests and other branches build nothing in Cloudflare; run it by hand from
# the Actions tab to redeploy. Needs the CLOUDFLARE_API_TOKEN secret (a token with the
# "Cloudflare Pages: Edit" permission) and the CLOUDFLARE_ACCOUNT_ID variable, on the
# "cloudflare" environment. See docs/contributing.md, "The site".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # What goes live passed the checks (a push to main may skip the local hook).
      - run: pnpm check

      - run: pnpm --filter @folijs/site build

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.166.0 pages deploy apps/site/dist --project-name=foli --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
